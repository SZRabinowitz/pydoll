[project]
name = "pydoll-python"
version = "2.23.0"
description = "Pydoll is a library for automating chromium-based browsers without a WebDriver, offering realistic interactions."
authors = [{ name = "Thalison Fernandes", email = "thalissfernandes99@gmail.com" }]
requires-python = ">=3.11,<4"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "websockets>=14,<17",
    "pyreqwest>=0.11.8",
    "aiofiles>=25.1.0,<26",
    "typing_extensions>=4.14.0,<5",
]

[project.optional-dependencies]
extractor = [
    "pydantic>=2.0,<3",
]

[dependency-groups]
dev = [
    "ruff>=0.7.1,<0.8",
    "pytest>=8.3.3,<9",
    "taskipy>=1.14.0,<2",
    "pytest-asyncio>=0.24.0,<0.25",
    "pytest-cov>=6.0.0,<7",
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.6.11,<10",
    "pymdown-extensions>=10.14.3,<11",
    "mkdocstrings[python]>=0.29.1,<0.30",
    "griffe-typingdoc>=0.2.8,<0.3",
    "mkdocs-static-i18n>=1.3.0,<2",
]

[tool.uv.build-backend]
module-name = ["pydoll"]
module-root = ""
source-include = ["pydoll/py.typed"]

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py310"


[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']
ignore = ['PLR0913', 'PLR0917', 'PLR0904', 'E701']
exclude = ['tests', 'tests/*']

[tool.ruff.format]
preview = true
quote-style = 'single'
docstring-code-format = true
docstring-code-line-length = 79
exclude = ['tests', 'tests/*']

[tool.pytest.ini_options]
pythonpath = "."
addopts = '-p no:warnings'

[tool.coverage.run]
# Declarative layers are excluded from the coverage target: protocol event
# TypedDicts carry no logic, and the command factories are thin CDP-dict builders
# exercised through the methods that call them (1:1 tests would be tautological).
omit = [
    'pydoll/protocol/*/events.py',
    'pydoll/commands/*.py',
]

[tool.coverage.report]
exclude_also = [
    'if TYPE_CHECKING:',
    'if __name__ == .__main__.:',
    'raise NotImplementedError',
    '@(abc\.)?abstractmethod',
    '\.\.\.',
]

[tool.taskipy.tasks]
lint = 'ruff check .; ruff check . --diff'
format = 'ruff check . --fix; ruff format .'
test = 'pytest -s -x --cov=pydoll -vv'
post_test = 'coverage html'

[tool.mypy]
exclude = [
    "tests/",
]
